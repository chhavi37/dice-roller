<!DOCTYPE html>
<head>
    <title>Dice roller</title>
    <style>
        #container{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;

        }
        button{
            font-size: 1.5rem;
            padding: 10px 15px;
            border-radius: 10px;
            border: none;
            background-color: rgb(14, 95, 162);
            color: white;
            font-weight: bold;
            cursor: pointer
            ;
        }
        button:hover{
            background-color: rgb(31, 115, 198);
        }
        button:active{
            background-color: rgb(69, 150, 231);
        }
        input{
            font-size: 2rem;
            width: 150px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>DICE ROLLER</h1>
        <label> Number of dice:</label>
        <input type="number" id = "numOfDice" value="1" min="1">
        <button onclick="rollDice()">Roll Dice</button>
        <div id="diceResult">

        </div>
        <div id="diceImages">
            
        </div>
    </div>

    <script>
        function rollDice(){
            const numOfDice=document.getElementById("numOfDice").value;
            const diceResult= document.getElementById("diceResult");
            const diceImages = document.getElementById("diceImages");
            const values = [];
            const images = [];
            
            for(let i = 0 ; i<numOfDice;i++){
                const value = Math.floor(Math.random()*6)+1;
                values.push(value);
                images.push(`<img src="${value}.png"> alt="Dice ${value}"`);
            }
            diceResult.textContent=`dice: ${values.join(', ')}`;
            diceImages.innerHTML= images.join(' ');

        }
        
    </script>
</body>
</html>
